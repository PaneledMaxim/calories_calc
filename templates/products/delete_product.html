{% extends 'base.html' %}

{% block title %}Удалить продукт - Calorie Tracker{% endblock %}

{% block content %}
<div class="card">
    <h1>Удалить продукт</h1>
    <p style="color: #d32f2f; font-weight: 500;">Вы уверены, что хотите удалить продукт "<strong>{{ product.name }}</strong>"?</p>
    <p class="muted">Это действие нельзя отменить.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" style="background-color: #d32f2f; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">Удалить</button>
            <a class="button-link" href="{% url 'products:list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
