{% extends 'base.html' %}

{% block title %}Редактировать продукт - Calorie Tracker{% endblock %}

{% block content %}
<div class="card">
    <h1>Редактировать продукт</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Сохранить</button>
            <a class="button-link" href="{% url 'products:list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
