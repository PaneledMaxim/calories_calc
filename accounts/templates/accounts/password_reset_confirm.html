{% extends "base.html" %}

{% block content %}
    <h1>Новый пароль</h1>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить пароль</button>
        </form>
    {% else %}
        <p>Ссылка для восстановления пароля недействительна.</p>
    {% endif %}
{% endblock %}
