{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<section class="card">
    <h1>Введите новый пароль</h1>
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Обновить пароль</button>
        </form>
    {% else %}
        <p>Ссылка для восстановления пароля недействительна.</p>
    {% endif %}
</section>
{% endblock %}
