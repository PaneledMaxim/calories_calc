{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<section class="card">
    <h1>Восстановление пароля</h1>
    <p class="muted">Введите email, указанный при регистрации. Ссылка будет сохранена в папку `sent_emails`.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить письмо</button>
    </form>
</section>
{% endblock %}
